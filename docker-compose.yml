version: '3.8'

services:
  # ---- Redis（缓存 + 消息队列） ----
  redis:
    image: redis:7-alpine
    container_name: aqw-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---- NestJS 后端（SQLite，无需 PostgreSQL） ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aqw-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:./dev.db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-production-jwt-secret}
      - JWT_EXPIRES_IN=24h
      - FRONTEND_URL=http://localhost:3000
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
    depends_on:
      redis:
        condition: service_healthy

  # ---- AI 量化引擎 ----
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: aqw-ai-engine
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
