version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: aqw-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aqw-network

  backend:
    image: ${DOCKER_REGISTRY:-your-dockerhub-username}/l3-ai-quant-wallet-backend:latest
    container_name: aqw-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:/app/prisma/dev.db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=24h
      - FRONTEND_URL=https://${DOMAIN:-localhost}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    volumes:
      - backend-data:/app/prisma
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - aqw-network

  frontend:
    image: ${DOCKER_REGISTRY:-your-dockerhub-username}/l3-ai-quant-wallet-frontend:latest
    container_name: aqw-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://${DOMAIN:-localhost}/api
      - NEXT_PUBLIC_WS_URL=wss://${DOMAIN:-localhost}/ws
    depends_on:
      - backend
    networks:
      - aqw-network

  ai-engine:
    image: ${DOCKER_REGISTRY:-your-dockerhub-username}/l3-ai-quant-wallet-ai-engine:latest
    container_name: aqw-ai-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - aqw-network

networks:
  aqw-network:
    driver: bridge

volumes:
  backend-data:
